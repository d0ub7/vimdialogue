name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack the addon
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip -X -r "VimDialogue-${version}-forever.zip" VimDialogue

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$version" \
            --generate-notes \
            "VimDialogue-${version}-forever.zip"
